<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - MaintainX</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style.css" />
    <script src="/src/global-ui.js"></script>
    <meta name="view-transition" content="same-origin">
  </head>
  <body class="auth-page">
    <!-- Background Elements -->
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="auth-container container">
      <div class="auth-box glass-panel">
        
        <!-- Logo -->
        <div class="auth-header">
          <a href="/" class="logo auth-logo">
            <div class="logo-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            </div>
            Maintain<span>X</span>
          </a>
          <p class="auth-subtitle">Pusat Kendali Pekerjaan Maintenance Anda</p>
        </div>

        <!-- Auth Tabs -->
        <div style="display: flex; justify-content: flex-end; margin-bottom: 16px;">
          <button id="theme-toggle" class="btn btn-secondary theme-btn" aria-label="Toggle Dark Mode" style="padding: 6px 12px;">ðŸŒ™</button>
        </div>
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Masuk</button>
          <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Daftar</button>
        </div>

        <!-- Login Form -->
        <form id="form-login" class="auth-form active">
          <div class="form-group">
            <label for="login-email">Email atau Username</label>
            <input type="text" id="login-email" class="form-input" placeholder="contoh@perusahaan.com atau Admin" required>
          </div>
          <div class="form-group">
            <label for="login-role">Kategori Pengguna (Level)</label>
            <select id="login-role" class="form-input" required>
              <option value="Administrator">Administrator</option>
              <option value="Supervisor">Supervisor</option>
              <option value="Admin">Admin</option>
              <option value="Visitor">Visitor</option>
              <option value="Foreman">Foreman</option>
              <option value="Warehouse">Warehouse</option>
              <option value="Teknisi">Teknisi</option>
            </select>
          </div>
          <div class="form-group">
            <div class="label-row">
              <label for="login-password">Password</label>
              <a href="#" class="forgot-link" onclick="toggleForgotPassword(true); return false;">Lupa Password?</a>
            </div>
            <input type="password" id="login-password" class="form-input" placeholder="Masukkan password Anda" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Masuk ke Dashboard</button>
        </form>

        <!-- Register Form -->
        <form id="form-register" class="auth-form hidden">
          <div class="form-group">
            <label for="reg-name">Nama Lengkap</label>
            <input type="text" id="reg-name" class="form-input" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" class="form-input" placeholder="contoh@perusahaan.com" required>
          </div>
          <div class="form-group">
            <label for="reg-password">Password Baru</label>
            <input type="password" id="reg-password" class="form-input" placeholder="Minimal 8 karakter" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Daftar Sekarang</button>
        </form>

        <!-- Forgot Password Form -->
        <form id="form-forgot" class="auth-form hidden">
          <p class="form-desc">Masukkan email Anda dan kami akan mengirimkan tautan untuk mengatur ulang password Anda.</p>
          <div class="form-group">
            <label for="forgot-email">Email Terdaftar</label>
            <input type="email" id="forgot-email" class="form-input" placeholder="contoh@perusahaan.com" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Kirim Tautan Reset</button>
          <button type="button" class="btn btn-secondary btn-block mt-3" onclick="toggleForgotPassword(false)">Kembali ke Masuk</button>
        </form>

      </div>
    </div>

    <script>
      function switchTab(tab) {
        // Toggle tabs
        document.getElementById('tab-login').classList.remove('active');
        document.getElementById('tab-register').classList.remove('active');
        document.getElementById(`tab-${tab}`).classList.add('active');

        // Hide all forms
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('form-register').classList.add('hidden');
        document.getElementById('form-forgot').classList.add('hidden');

        // Show selected form
        document.getElementById(`form-${tab}`).classList.remove('hidden');
        
        // Show tabs again in case we were in forgot password
        document.querySelector('.auth-tabs').style.display = 'flex';
      }

      function toggleForgotPassword(show) {
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('form-register').classList.add('hidden');
        
        if (show) {
          document.querySelector('.auth-tabs').style.display = 'none';
          document.getElementById('form-forgot').classList.remove('hidden');
        } else {
          document.querySelector('.auth-tabs').style.display = 'flex';
          document.getElementById('form-login').classList.remove('hidden');
        }
      }

      // Handle Mock Login
      document.getElementById('form-login').addEventListener('submit', function(e) {
        e.preventDefault(); // Mencegah reload halaman
        const emailOrUser = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        let role = document.getElementById('login-role').value;

        // Ambil data pekerja dari LocalStorage
        const savedWorkers = localStorage.getItem('mx_workers');
        let worker = null;

        if (savedWorkers) {
          const workers = JSON.parse(savedWorkers);
          // Cari pekerja berdasarkan email atau nama
          worker = workers.find(w => w.email === emailOrUser || w.nama === emailOrUser);
        }

        if (worker) {
          // Pekerja ditemukan di database
          if (password === worker.password || password === '12345') {
            if (worker.status === 'Off Site') {
              alert('Akses Ditolak! Akun Anda saat ini berstatus Off Site dan tidak dapat masuk.');
              return;
            }
            // Login sukses
            localStorage.setItem('userRole', worker.profilAkun);
            localStorage.setItem('userName', worker.nama);
            window.location.href = 'dashboard.html';
          } else {
            alert('Password salah!');
          }
        } else {
          // Fallback: Jika tidak ditemukan (Mockup Admin manual)
          if (password === '12345') {
            if (emailOrUser === 'Admin' || emailOrUser === 'admin@maintainx.com') {
              role = 'Administrator';
            }
            localStorage.setItem('userRole', role);
            localStorage.setItem('userName', emailOrUser || 'Admin User');
            window.location.href = 'dashboard.html';
          } else {
            alert('Akun tidak ditemukan atau password salah! Coba gunakan Password "12345".');
          }
        }
      });
    </script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
